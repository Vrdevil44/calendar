<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar</title>
    <meta name="description" content="A tiny daily expense tracker on a month calendar. Click a day, add entries, and watch the colour-coded totals update. Runs entirely in your browser." />
    <meta name="theme-color" content="#0056b3" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Calendar" />
    <meta property="og:title" content="Calendar" />
    <meta property="og:description" content="Daily expense tracker on a month calendar with colour-coded totals. No account, no backend: your data stays in your browser." />
    <meta property="og:url" content="https://vrdevil44.github.io/calendar/" />
    <meta property="og:image" content="https://vrdevil44.github.io/calendar/screenshots/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Month view of Calendar with green and red daily totals" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Calendar" />
    <meta name="twitter:description" content="Daily expense tracker on a month calendar with colour-coded totals. Runs entirely in your browser." />
    <meta name="twitter:image" content="https://vrdevil44.github.io/calendar/screenshots/og-image.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230056b3'/%3E%3Crect x='10' y='18' width='44' height='36' rx='4' fill='%23fff'/%3E%3Crect x='10' y='10' width='44' height='14' rx='4' fill='%23ff8a7a'/%3E%3C/svg%3E" />
    <!-- FullCalendar standard bundle, pinned to 6.1.15 and verified with SRI.
         If you bump the version, regenerate the hash:
         curl -s <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"
        integrity="sha384-B1OFx8Gy9GjPu8UbUyXbGQpzll9ubAUQ9agInFJ8NnD7nYG1u/CLR+Sqr5yifl4q"
        crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Merriweather', Georgia, serif;
            background-color: #f7f2fb;
            background-image: linear-gradient(180deg, #fdeef6 0%, #f1ecfb 45%, #e9f6fb 100%);
            background-attachment: fixed;
            color: #222;
            margin: 0;
            padding: 20px;
            line-height: 1.45;
        }

        /* Soft candy header: title centred, copy button tucked top-right */
        .app-header {
            position: relative;
            max-width: 900px;
            margin: 0 auto 18px;
            padding: 18px 20px;
            box-sizing: border-box;
            border-radius: 20px;
            background: linear-gradient(120deg, #ffd3e6 0%, #dcd0ff 50%, #c4ebff 100%);
            box-shadow: 0 6px 18px rgba(130, 90, 200, 0.18);
        }

        h1 {
            font-weight: bold;
            color: #2b1650;
            text-align: center;
            font-size: clamp(26px, 6vw, 36px);
            margin: 0;
            letter-spacing: 0.5px;
        }

        #copy-summary {
            position: absolute;
            top: 50%;
            right: 18px;
            transform: translateY(-50%);
            color: #2b1650;
            background-color: rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
        }

        #copy-summary:hover { background-color: #fff; }

        button,
        input,
        select,
        textarea {
            font-family: 'Roboto', Arial, sans-serif;
        }

        :focus-visible {
            outline: 3px solid #ff9f1c;
            outline-offset: 2px;
        }

        /* Notices */
        #demo-note,
        .banner {
            max-width: 900px;
            margin: 0 auto 12px;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            box-sizing: border-box;
        }

        #demo-note {
            background-color: #e7f3ff;
            border: 1px solid #0056b3;
            color: #004085;
        }

        .banner {
            background-color: #fff3cd;
            border: 1px solid #856404;
            color: #533f03;
        }

        .banner.error {
            background-color: #f8d7da;
            border-color: #842029;
            color: #58151c;
        }

        #status {
            max-width: 900px;
            margin: 0 auto 10px;
            min-height: 20px;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 14px;
            color: #004085;
            text-align: center;
        }

        /* Toolbar */
        #toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-family: 'Roboto', Arial, sans-serif;
        }

        #toolbar label {
            font-size: 14px;
            font-weight: bold;
        }

        #date-search {
            padding: 9px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #8f6fe0;
            background-color: #fff;
        }

        #budget-input {
            padding: 9px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #8f6fe0;
        }

        .btn {
            padding: 10px 15px;
            font-size: 16px;
            color: #fff;
            background-color: #6a4fd1;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #5238b0;
        }

        .btn.secondary {
            background-color: #565e64;
        }

        .btn.secondary:hover {
            background-color: #3d4348;
        }

        #legend {
            text-align: center;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .swatch {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 1px solid #555;
            border-radius: 3px;
            vertical-align: -1px;
            margin: 0 4px 0 10px;
        }

        .swatch.low { background-color: #c9f0cb; }
        .swatch.high { background-color: #f8b4ab; }

        /* Calendar */
        #calendar {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #cdbdf5;
            padding: 20px;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0px 6px 20px rgba(130, 90, 200, 0.15);
            box-sizing: border-box;
            --fc-border-color: #efe7fb;
            --fc-today-bg-color: transparent;
            --fc-button-bg-color: #6a4fd1;
            --fc-button-border-color: #6a4fd1;
            --fc-button-hover-bg-color: #5238b0;
            --fc-button-hover-border-color: #5238b0;
            --fc-button-active-bg-color: #43309a;
            --fc-button-active-border-color: #43309a;
        }

        .fc .fc-toolbar-title { color: #2b1650; }
        .fc .fc-button { border-radius: 12px; }
        .fc .fc-col-header-cell { background: #f6f0ff; }
        .fc .fc-col-header-cell-cushion { color: #3b2370; padding: 6px 4px; }

        /* Rounded tiles: the colour lives on the inner frame, not the table cell */
        .fc-daygrid-day-frame {
            margin: 2px;
            border-radius: 12px;
        }

        /* QA fix: keep the 7-column grid inside the card at any viewport width */
        .fc .fc-scrollgrid,
        .fc .fc-daygrid-body table,
        .fc .fc-col-header table {
            width: 100%;
            table-layout: fixed;
        }

        .fc-day-today .fc-daygrid-day-frame { box-shadow: inset 0 0 0 2px #ff7eb6; }

        .fc-daygrid-day {
            position: relative;
            cursor: pointer;
        }

        .fc-daygrid-day-number {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #222;
        }

        /* Days from adjacent months: shaded instead of faded, so their numbers keep full contrast */
        .fc .fc-day-other .fc-daygrid-day-top { opacity: 1; }
        .fc-day-other .fc-daygrid-day-number { font-weight: normal; color: #444; }
        .fc-day-other:not(.day-low):not(.day-high) .fc-daygrid-day-frame { background-color: #f3f0f7; }

        .total-display {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        /* Colour-coded totals (text/background pairs are >= 7:1 contrast) */
        .fc-daygrid-day.day-low .fc-daygrid-day-frame { background-color: #c9f0cb; }
        .fc-daygrid-day.day-high .fc-daygrid-day-frame { background-color: #f8b4ab; }
        .day-low .total-display { color: #0f2e14; }
        .day-high .total-display { color: #4a0a02; }

        /* Forecast: lighter text + dashed outline so projections never read as real totals */
        .projected-display {
            position: absolute;
            left: 4px;
            right: 4px;
            bottom: 4px;
            padding: 1px 2px;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 11px;
            font-style: italic;
            text-align: center;
            color: #5a6169;
            border: 1px dashed #9aa1a8;
            border-radius: 4px;
            overflow-wrap: anywhere;
            pointer-events: none;
        }

        #forecast-summary {
            max-width: 900px;
            margin: 12px auto 0;
            padding: 8px 12px;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #222;
            background-color: #eef1f4;
            border-radius: 12px;
        }

        /* Category chips in day cells, and the month breakdown strip */
        .cat-chips {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            pointer-events: none;
        }

        .cat-chip {
            min-width: 18px;
            height: 18px;
            padding: 0 2px;
            box-sizing: border-box;
            border-radius: 9px;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            color: #111;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.18);
        }

        .cat-chip.more { background-color: #e4e0ea; font-family: 'Roboto', Arial, sans-serif; font-weight: 700; }

        #breakdown {
            max-width: 900px;
            margin: 0 auto 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-family: 'Roboto', Arial, sans-serif;
            font-size: 14px;
        }

        #breakdown .empty { color: #5d5470; }

        .break-chip {
            padding: 5px 12px;
            border-radius: 999px;
            color: #111;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        #category-input {
            width: 100%;
            margin-top: 4px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #767676;
            border-radius: 10px;
            box-sizing: border-box;
            background-color: #fff;
        }

        #forecast-summary.over { color: #7a0c00; background-color: #f8b4ab; }

        /* Modal */
        .modal {
            position: fixed;
            z-index: 10;
            inset: 0;
            overflow-y: auto;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal[hidden] {
            display: none;
        }

        .modal-content {
            position: relative;
            background-color: #fff;
            margin: 5vh auto;
            padding: 20px;
            border: 2px solid #cdbdf5;
            border-radius: 20px;
            width: min(420px, 92vw);
            box-sizing: border-box;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            font-family: 'Roboto', Arial, sans-serif;
        }

        .modal-content h2 {
            margin: 0 40px 10px 0;
            font-size: 18px;
        }

        .close {
            position: absolute;
            top: 8px;
            right: 12px;
            padding: 0 8px;
            color: #444;
            background: none;
            border: none;
            font-size: 30px;
            line-height: 1.2;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        #entry-form label {
            display: block;
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
        }

        #name-input,
        #amount-input,
        #remark-input {
            width: 100%;
            margin-top: 4px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #767676;
            border-radius: 5px;
            box-sizing: border-box;
        }

        #remark-input {
            resize: vertical;
            min-height: 60px;
        }

        #form-error {
            min-height: 18px;
            margin-top: 8px;
            font-size: 14px;
            color: #842029;
        }

        #save-entry {
            width: 100%;
            margin-top: 6px;
            background-color: #1e6e32;
        }

        #save-entry:hover {
            background-color: #165326;
        }

        #cancel-edit {
            width: 100%;
            margin-top: 8px;
        }

        #cancel-edit[hidden] {
            display: none;
        }

        #entry-list {
            list-style: none;
            margin: 14px 0 0;
            padding: 0;
        }

        .entry {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 10px;
            background-color: #f8f6fb;
            border: 1px solid #ddd5ec;
            border-left: 6px solid var(--cat, #a0a6ad);
        }

        .entry-text {
            overflow-wrap: anywhere;
        }

        .entry-actions {
            display: flex;
            flex-shrink: 0;
            gap: 6px;
        }

        .entry-actions button {
            padding: 6px 10px;
            font-size: 13px;
            color: #3b2370;
            background: #fff;
            border: 1px solid #3b2370;
            border-radius: 8px;
            cursor: pointer;
        }

        .entry-actions button.delete {
            color: #8a1c28;
            border-color: #8a1c28;
        }

        #total-amount {
            margin-top: 14px;
            font-size: 16px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            #calendar { padding: 8px; border-radius: 10px; }
            .fc .fc-toolbar { flex-wrap: wrap; gap: 6px; justify-content: center; }
            .fc .fc-toolbar-title { font-size: 1.2em; }
            .fc-daygrid-day-number { font-size: 12px; top: 2px; right: 3px; }
            .total-display { font-size: 10px; top: 55%; }
            .cat-chips { top: 3px; left: 3px; right: 18px; gap: 2px; }
            .cat-chip { min-width: 8px; width: 8px; height: 8px; padding: 0; border-radius: 50%; font-size: 0; line-height: 0; box-shadow: none; }
            .cat-chip.more { display: none; }
            #copy-summary { position: static; transform: none; display: block; margin: 10px auto 0; }
            .app-header { padding: 14px 12px; border-radius: 16px; }
            .projected-display { font-size: 9px; left: 1px; right: 1px; bottom: 1px; padding: 0; }
            #forecast-summary { font-size: 14px; }
            .fc .fc-col-header-cell-cushion { font-size: 12px; padding: 4px 0; }
        }
    </style>
</head>

<body>
    <main>
    <header class="app-header">
        <h1>Calendar</h1>
        <button type="button" class="btn" id="copy-summary">Copy summary</button>
    </header>
    <div id="demo-note">
        Demo mode: entries are saved in this browser's localStorage only. Nothing leaves your device, no account needed. The sample entries are fake.
    </div>
    <div id="banners"></div>
    <div id="toolbar">
        <label for="date-search">Go to date</label>
        <input type="date" id="date-search" />
        <button type="button" class="btn" id="goto-date">Go</button>
        <label for="budget-input">Daily budget ($)</label>
        <input type="text" id="budget-input" inputmode="decimal" autocomplete="off" size="8">
        <button type="button" class="btn secondary" id="load-demo">Load demo data</button>
        <button type="button" class="btn secondary" id="export-json">Export JSON</button>
        <button type="button" class="btn secondary" id="import-json">Import JSON</button>
        <input type="file" id="import-file" accept=".json,application/json" hidden />
    </div>
    <div id="legend"></div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="breakdown" aria-label="Month totals by category"></div>
    <div id="calendar"></div>
    <div id="forecast-summary" role="status"></div>
    </main>

    <div id="entryModal" class="modal" hidden>
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button type="button" class="close" id="close-modal" aria-label="Close">&times;</button>
            <h2 id="modal-title"></h2>
            <div id="over-budget" role="alert" hidden>Over daily budget</div>
            <form id="quick-form" novalidate>
                <label for="quick-input">Quick add</label>
                <input type="text" id="quick-input" autocomplete="off" placeholder="lunch 12.50  (add 'refund' to credit)">
                <button type="submit" class="btn" id="quick-add">Quick add</button>
                <div id="quick-hint" role="status"></div>
            </form>
            <div id="undo-bar"></div>
            <form id="entry-form" novalidate>
                <label for="name-input">Name</label>
                <input type="text" id="name-input" maxlength="80" autocomplete="off" required>
                <label for="amount-input">Amount ($, minus for refunds)</label>
                <input type="text" id="amount-input" inputmode="decimal" autocomplete="off" placeholder="e.g. 12.50" required>
                <label for="category-input">Category</label>
                <select id="category-input"></select>
                <label for="remark-input">Remark (optional)</label>
                <textarea id="remark-input" maxlength="200"></textarea>
                <label><input type="checkbox" id="repeat-input"> Repeat monthly</label>
                <div id="form-error" role="alert"></div>
                <button type="submit" class="btn" id="save-entry">Add entry</button>
                <button type="button" class="btn secondary" id="cancel-edit" hidden>Cancel edit</button>
            </form>
            <ul id="entry-list"></ul>
            <div id="total-amount"></div>
        </div>
    </div>

    <script>
        'use strict';

        // ---- Config -------------------------------------------------------
        // A day is "high" when its total is strictly greater than this (in cents).
        // Exactly $3,000.00 is still green. One constant on purpose: it becomes per-person later.
        var HIGH_DAY_THRESHOLD_CENTS = 3000 * 100;
        var MAX_ENTRY_CENTS = 1000000 * 100;   // sanity cap: $1,000,000 per entry
        var MAX_NAME = 80;
        var MAX_REMARK = 200;
        var BUDGET_KEY = 'veerjis-calendar-budget';
        var UNDO_MS = 8000;
        var QUICK_ADD_RE = /^(.+?)\s+(\d+(?:\.\d{1,2})?)\s*(refund|minus)?$/;
        var MAX_IMPORT_BYTES = 5 * 1024 * 1024;

        // Neon colour + emoji per category. `other` is the default and the fallback for unknown/missing values.
        var CATEGORIES = [
            { key: 'food',      label: 'Food',      emoji: '\uD83C\uDF54',        color: '#ff9f1c' },
            { key: 'transport', label: 'Transport', emoji: '\uD83D\uDE8C',        color: '#3d8bff' },
            { key: 'home',      label: 'Home',      emoji: '\uD83C\uDFE0',        color: '#b46cff' },
            { key: 'utilities', label: 'Utilities', emoji: '\uD83D\uDCA1',        color: '#ffe135' },
            { key: 'fun',       label: 'Fun',       emoji: '\uD83C\uDF89',        color: '#ff4fa3' },
            { key: 'shopping',  label: 'Shopping',  emoji: '\uD83D\uDECD\uFE0F', color: '#19d9c3' },
            { key: 'health',    label: 'Health',    emoji: '\uD83D\uDC8A',        color: '#3fe56a' },
            { key: 'other',     label: 'Other',     emoji: '\uD83D\uDCE6',        color: '#a0a6ad' }
        ];
        var DEFAULT_CATEGORY = 'other';
        var MAX_DAY_CHIPS = 4;

        var SCHEMA_VERSION = 2;
        var STORE_KEY = 'veerjis-calendar';
        var CORRUPT_KEY = 'veerjis-calendar-corrupt';
        var LEGACY_KEY = 'veerjis-calendar-entries-v1';   // v1: bare {date: [{amount: float}]} map

        // ---- Helpers ------------------------------------------------------
        function catOf(key) {
            for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].key === key) return CATEGORIES[i];
            return CATEGORIES[CATEGORIES.length - 1];
        }

        function pad(n) { return (n < 10 ? '0' : '') + n; }

        // Local calendar date <-> 'YYYY-MM-DD'. Never use new Date('YYYY-MM-DD'): that parses
        // as UTC midnight and lands on the previous day west of Greenwich (e.g. Vancouver).
        function fmtDate(d) {
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function parseISODate(s) {
            var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
            if (!m) return null;
            var d = new Date(+m[1], +m[2] - 1, +m[3]);
            return fmtDate(d) === s ? d : null;
        }

        // Money is integer cents everywhere; strings are parsed without floats.
        function parseCents(text) {
            var m = /^(-?)(\d{1,9})(?:\.(\d{1,2}))?$/.exec(String(text).trim());
            if (!m) return null;
            var cents = parseInt(m[2], 10) * 100 + (m[3] ? parseInt((m[3] + '0').slice(0, 2), 10) : 0);
            if (cents > MAX_ENTRY_CENTS) return null;
            return m[1] && cents ? -cents : cents;
        }

        function formatCents(cents) {
            var abs = Math.abs(cents);
            return (cents < 0 ? '-' : '') + '$' + Math.floor(abs / 100).toLocaleString('en-US') + '.' + pad(abs % 100);
        }

        var idCounter = 0;
        function makeId() {
            if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
            idCounter += 1;
            return 'e' + Date.now().toString(36) + '-' + idCounter;
        }

        // ---- UI notices ---------------------------------------------------
        var bannersEl = document.getElementById('banners');
        var statusEl = document.getElementById('status');

        // One banner per key; pass null to clear it.
        function setBanner(key, text, isError) {
            var el = bannersEl.querySelector('[data-key="' + key + '"]');
            if (!text) { if (el) el.remove(); return; }
            if (!el) {
                el = document.createElement('div');
                el.setAttribute('data-key', key);
                el.setAttribute('role', 'alert');
                bannersEl.appendChild(el);
            }
            el.className = 'banner' + (isError ? ' error' : '');
            el.textContent = text;
        }

        function say(text) { statusEl.textContent = text; }

        // ---- Store --------------------------------------------------------
        // Persisted shape: { version: 2, entries: { 'YYYY-MM-DD': [ {id, name, cents, remark, category} ] } }
        // `category` is a CATEGORIES key; null/unknown counts as Other.
        // Optional `recurring`: [ {id, name, cents, remark, category, dayOfMonth} ], one template per series.
        // Instances are computed per month by getDayItems(); they are never written into `entries`.
        var entries = {};
        var recurring = [];

        // Returns a clean entry, or null if it is unusable. `legacy` accepts v1's float `amount`.
        function cleanEntry(e, legacy) {
            if (!e || typeof e !== 'object') return null;
            var name = typeof e.name === 'string' ? e.name.trim().slice(0, MAX_NAME) : '';
            if (!name) return null;
            var cents = e.cents;
            if (legacy) cents = typeof e.amount === 'number' ? Math.round(e.amount * 100) : NaN;
            if (!Number.isSafeInteger(cents) || Math.abs(cents) > MAX_ENTRY_CENTS) return null;
            return {
                id: typeof e.id === 'string' && e.id ? e.id : makeId(),
                name: name,
                cents: cents,
                remark: typeof e.remark === 'string' ? e.remark.trim().slice(0, MAX_REMARK) : '',
                category: catOf(e.category).key
            };
        }

        function cleanTemplate(t) {
            var e = cleanEntry(t, false);
            if (!e || !Number.isInteger(t.dayOfMonth) || t.dayOfMonth < 1 || t.dayOfMonth > 31) return null;
            e.dayOfMonth = t.dayOfMonth;
            return e;
        }

        // Validates a { date: [entry] } map. Returns { entries, dropped }.
        function cleanEntryMap(map, legacy) {
            var out = {};
            var dropped = 0;
            Object.keys(map).forEach(function (dateStr) {
                var list = map[dateStr];
                if (!parseISODate(dateStr) || !Array.isArray(list)) { dropped += Array.isArray(list) ? list.length : 1; return; }
                list.forEach(function (raw) {
                    var e = cleanEntry(raw, legacy);
                    if (!e) { dropped += 1; return; }
                    (out[dateStr] = out[dateStr] || []).push(e);
                });
            });
            return { entries: out, dropped: dropped };
        }

        // Validates a full envelope (from storage or an import file). Returns null if unusable.
        function readEnvelope(obj) {
            if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return null;
            if (!Number.isInteger(obj.version) || obj.version < 1 || obj.version > SCHEMA_VERSION) return null;
            if (!obj.entries || typeof obj.entries !== 'object' || Array.isArray(obj.entries)) return null;
            var result = cleanEntryMap(obj.entries, false);
            result.recurring = [];
            if (Array.isArray(obj.recurring)) {
                obj.recurring.forEach(function (raw) {
                    var t = cleanTemplate(raw);
                    if (t) result.recurring.push(t); else result.dropped += 1;
                });
            }
            return result;
        }

        function persist() {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify({ version: SCHEMA_VERSION, entries: entries, recurring: recurring }));
                setBanner('storage', null);
                return true;
            } catch (e) {
                var full = e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED');
                setBanner('storage', (full ? 'Browser storage is full' : 'Browser storage is unavailable (private mode or blocked)') +
                    ', so your changes are not being saved. They stay in this tab until you close it. Use Export JSON to keep a copy.', true);
                return false;
            }
        }

        function loadStore() {
            var raw;
            try {
                raw = localStorage.getItem(STORE_KEY);
            } catch (e) {
                // Storage blocked entirely: run in memory with demo data and warn.
                seedDemo();
                persist();
                return;
            }

            if (raw === null) {
                var legacy = null;
                try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch (e) { legacy = null; }
                if (legacy && typeof legacy === 'object' && !Array.isArray(legacy)) {
                    entries = cleanEntryMap(legacy, true).entries;   // legacy key is left untouched
                } else {
                    seedDemo();
                }
                persist();
                return;
            }

            var parsed = null;
            try { parsed = JSON.parse(raw); } catch (e) { parsed = null; }
            var result = readEnvelope(parsed);
            if (!result) {
                // Corrupt or from a newer app version: keep the raw text aside and start empty.
                try { localStorage.setItem(CORRUPT_KEY, raw); } catch (e) { /* best effort */ }
                setBanner('corrupt', 'Your saved data could not be read, so the calendar started empty. ' +
                    'A raw copy was kept in browser storage under "' + CORRUPT_KEY + '". Importing a JSON backup will restore your entries.', true);
                return;
            }
            entries = result.entries;
            recurring = result.recurring;
            if (result.dropped) {
                setBanner('dropped', result.dropped + ' saved entr' + (result.dropped === 1 ? 'y was' : 'ies were') + ' invalid and skipped.');
            }
        }

        function getEntries(dateStr) { return entries[dateStr] || []; }

        // Virtual instances of recurring templates for one date (day clamped to the month's length).
        function getInstances(dateStr) {
            var d = parseISODate(dateStr);
            var daysInMonth = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
            return recurring.filter(function (t) { return Math.min(t.dayOfMonth, daysInMonth) === d.getDate(); })
                .map(function (t) {
                    return { id: 'series:' + t.id + ':' + dateStr, templateId: t.id, recurring: true,
                        name: t.name, cents: t.cents, remark: t.remark, category: t.category };
                });
        }

        // Stored entries followed by recurring instances: everything that counts toward a day.
        function getDayItems(dateStr) { return getEntries(dateStr).concat(getInstances(dateStr)); }

        function dayTotal(dateStr) {
            return getDayItems(dateStr).reduce(function (sum, e) { return sum + e.cents; }, 0);
        }

        // Returns the new entry's id.
        function addEntry(dateStr, fields) {
            var id = makeId();
            (entries[dateStr] = entries[dateStr] || []).push({
                id: id, name: fields.name, cents: fields.cents, remark: fields.remark,
                category: fields.category || DEFAULT_CATEGORY
            });
            persist();
            return id;
        }

        // fields: {name, cents, remark, dayOfMonth}. Returns the new template's id.
        function addTemplate(fields) {
            var id = makeId();
            recurring.push({ id: id, name: fields.name, cents: fields.cents, remark: fields.remark,
                category: fields.category || DEFAULT_CATEGORY, dayOfMonth: fields.dayOfMonth });
            persist();
            return id;
        }

        function updateTemplate(id, fields) {
            recurring.forEach(function (t) {
                if (t.id === id) { t.name = fields.name; t.cents = fields.cents; t.remark = fields.remark; t.category = fields.category; }
            });
            persist();
        }

        function deleteTemplate(id) {
            recurring = recurring.filter(function (t) { return t.id !== id; });
            persist();
        }

        // Quick-add grammar: "<name> <amount> [refund|minus]". Returns {name, cents} or null (never guesses).
        function parseQuickAdd(text) {
            var m = QUICK_ADD_RE.exec(String(text).trim());
            if (!m) return null;
            var name = m[1].trim();
            var cents = parseCents(m[2]);
            if (!name || name.length > MAX_NAME || cents === null) return null;
            return { name: name, cents: m[3] && cents ? -cents : cents };
        }

        // ---- Budget -------------------------------------------------------
        // User-settable daily budget in cents; defaults to HIGH_DAY_THRESHOLD_CENTS.
        var budgetCents = HIGH_DAY_THRESHOLD_CENTS;

        function loadBudget() {
            try {
                var raw = localStorage.getItem(BUDGET_KEY);
                var cents = raw === null ? null : parseCents(raw);
                if (cents !== null && cents >= 0) budgetCents = cents;
            } catch (e) { /* storage blocked: keep default */ }
        }

        function setBudget(cents) {
            budgetCents = cents === null ? HIGH_DAY_THRESHOLD_CENTS : cents;
            try {
                if (cents === null) localStorage.removeItem(BUDGET_KEY);
                else localStorage.setItem(BUDGET_KEY, formatPlain(cents));
            } catch (e) { /* best effort; the in-memory value still applies */ }
        }

        function formatPlain(cents) {
            return (cents < 0 ? '-' : '') + Math.floor(Math.abs(cents) / 100) + '.' + pad(Math.abs(cents) % 100);
        }

        function updateEntry(dateStr, id, fields) {
            getEntries(dateStr).forEach(function (e) {
                if (e.id === id) { e.name = fields.name; e.cents = fields.cents; e.remark = fields.remark; e.category = fields.category; }
            });
            persist();
        }

        function deleteEntry(dateStr, id) {
            if (!entries[dateStr]) return;
            entries[dateStr] = entries[dateStr].filter(function (e) { return e.id !== id; });
            if (!entries[dateStr].length) delete entries[dateStr];
            persist();
        }

        // Obviously fake sample data, dated relative to today so the month always looks alive.
        function seedDemo() {
            var today = new Date();
            var data = {};
            function put(daysAgo, name, cents, remark, category) {
                var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysAgo);
                (data[fmtDate(d)] = data[fmtDate(d)] || []).push(
                    { id: makeId(), name: '[Demo] ' + name, cents: cents, remark: remark, category: category });
            }
            put(0, 'Sample groceries', 8450, 'Fake data', 'food');
            put(1, 'Pretend petrol', 6200, 'Not a real purchase', 'transport');
            put(1, 'Made-up lunch', 1475, 'Fake data', 'food');
            put(3, 'Imaginary insurance', 37800, 'Sample entry', 'utilities');
            put(4, 'Pretend movie night', 3875, 'Fake data', 'fun');
            put(6, 'Sample phone bill', 10000, 'Not real', 'utilities');
            put(9, 'Pretend rent', 130000, 'High-spend day: shows red', 'home');
            put(9, 'Imaginary laptop', 140000, 'Sample entry', 'shopping');
            put(9, 'Made-up dinner party', 32000, 'Fake data', 'fun');
            put(12, 'Pretend refund', -2500, 'Negative amounts count as refunds', 'shopping');
            entries = data;
        }

        // ---- Boot ---------------------------------------------------------
        loadStore();
        loadBudget();

        var calendarEl = document.getElementById('calendar');
        var modal = document.getElementById('entryModal');
        var form = document.getElementById('entry-form');
        var nameInput = document.getElementById('name-input');
        var amountInput = document.getElementById('amount-input');
        var remarkInput = document.getElementById('remark-input');
        var saveBtn = document.getElementById('save-entry');
        var cancelEditBtn = document.getElementById('cancel-edit');
        var formError = document.getElementById('form-error');
        var entryList = document.getElementById('entry-list');
        var totalAmountEl = document.getElementById('total-amount');
        var selectedDate = null;
        var editingId = null;
        var editingSeriesId = null;
        var repeatInput = document.getElementById('repeat-input');
        var quickForm = document.getElementById('quick-form');
        var quickInput = document.getElementById('quick-input');
        var quickHint = document.getElementById('quick-hint');
        var undoBar = document.getElementById('undo-bar');
        var overBudgetEl = document.getElementById('over-budget');
        var categoryInput = document.getElementById('category-input');
        var undoTimer = null;
        var calendar = null;

        CATEGORIES.forEach(function (c) {
            var opt = document.createElement('option');
            opt.value = c.key;
            opt.textContent = c.emoji + ' ' + c.label;
            if (c.key === DEFAULT_CATEGORY) opt.defaultSelected = true;   // form.reset() returns here
            categoryInput.appendChild(opt);
        });

        function renderLegend() {
            document.getElementById('legend').innerHTML =
                '<span class="swatch low"></span>' + formatCents(budgetCents) + ' or less per day' +
                '<span class="swatch high"></span>over ' + formatCents(budgetCents);
        }
        renderLegend();

        // ---- Burn-rate forecast -------------------------------------------
        // Pace = (sum of entries dated the 1st..today of the current month) / days elapsed.
        // Projection for day d = pace x d, kept in integer cents (round once, at the end).
        // Projections are display-only: they never touch entries or real day totals.
        function getForecast() {
            var now = new Date();
            var year = now.getFullYear(), month = now.getMonth();
            var elapsed = now.getDate();
            var daysInMonth = new Date(year, month + 1, 0).getDate();
            var prefix = year + '-' + pad(month + 1) + '-';
            var sum = 0, count = 0;
            for (var d = 1; d <= elapsed; d++) {
                var key = prefix + pad(d);
                count += getDayItems(key).length;
                sum += dayTotal(key);
            }
            return {
                prefix: prefix, elapsed: elapsed, daysInMonth: daysInMonth, hasData: count > 0,
                monthEnd: new Date(year, month, daysInMonth),
                projected: function (day) { return Math.round(sum * day / elapsed); },
                overThreshold: sum > budgetCents * elapsed   // pace > threshold, no division
            };
        }

        // ---- Month breakdown ----------------------------------------------
        // First day of the month the calendar is showing (today's month if the library did not load).
        function visibleMonth() {
            var d = new Date();
            try { if (calendar) d = calendar.getDate(); } catch (e) { /* use today */ }
            return new Date(d.getFullYear(), d.getMonth(), 1);
        }

        // Net cents per category for the visible month, in CATEGORIES order, nonzero only.
        function monthBreakdown() {
            var first = visibleMonth();
            var daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
            var sums = {};
            for (var d = 1; d <= daysInMonth; d++) {
                getDayItems(fmtDate(new Date(first.getFullYear(), first.getMonth(), d))).forEach(function (e) {
                    var k = catOf(e.category).key;
                    sums[k] = (sums[k] || 0) + e.cents;
                });
            }
            var rows = [], grand = 0;
            CATEGORIES.forEach(function (c) {
                if (sums[c.key]) rows.push({ cat: c, cents: sums[c.key] });
                grand += sums[c.key] || 0;
            });
            return { first: first, rows: rows, total: grand };
        }

        function renderBreakdown() {
            var el = document.getElementById('breakdown');
            el.textContent = '';
            var b = monthBreakdown();
            if (!b.rows.length) {
                var none = document.createElement('span');
                none.className = 'empty';
                none.textContent = 'No spending this month yet';
                el.appendChild(none);
                return;
            }
            b.rows.forEach(function (r) {
                var chip = document.createElement('span');
                chip.className = 'break-chip';
                chip.style.backgroundColor = r.cat.color;
                chip.textContent = r.cat.emoji + ' ' + r.cat.label + ' ' + formatCents(r.cents);
                el.appendChild(chip);
            });
        }

        function summaryText() {
            var b = monthBreakdown();
            var lines = ['Spending summary: ' + b.first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }), ''];
            if (!b.rows.length) lines.push('No entries this month.');
            b.rows.forEach(function (r) { lines.push(r.cat.label + ': ' + formatCents(r.cents)); });
            lines.push('', 'Total: ' + formatCents(b.total));
            return lines.join('\n');
        }

        function copyText(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                var ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
                if (ok) resolve(); else reject(new Error('copy failed'));
            });
        }

        var copyBtn = document.getElementById('copy-summary');
        var copyTimer = null;
        copyBtn.onclick = function () {
            copyText(summaryText()).then(function () {
                copyBtn.textContent = 'Copied \u2713';
                say('Summary copied to clipboard.');
            }, function () {
                copyBtn.textContent = 'Copy failed';
                say('Could not copy the summary.');
            }).then(function () {
                clearTimeout(copyTimer);
                copyTimer = setTimeout(function () { copyBtn.textContent = 'Copy summary'; }, 1800);
            });
        };

        function renderForecastSummary() {
            var f = getForecast();
            var el = document.getElementById('forecast-summary');
            el.classList.toggle('over', f.hasData && f.overThreshold);
            el.textContent = f.hasData
                ? 'At this pace: ' + formatCents(f.projected(f.daysInMonth)) + ' by ' +
                  f.monthEnd.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })
                : 'Add entries to see your forecast';
        }

        // ---- Day cells ----------------------------------------------------
        function decorateCell(cell, dateStr) {
            var frame = cell.querySelector('.fc-daygrid-day-frame') || cell;
            var old = cell.querySelector('.total-display');
            if (old) old.remove();
            var oldProj = cell.querySelector('.projected-display');
            if (oldProj) oldProj.remove();
            var oldBadge = cell.querySelector('.recurring-badge');
            if (oldBadge) oldBadge.remove();
            var oldChips = cell.querySelector('.cat-chips');
            if (oldChips) oldChips.remove();
            cell.classList.remove('day-low', 'day-high');

            var label = parseISODate(dateStr).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
            if (getDayItems(dateStr).length) {
                var total = dayTotal(dateStr);
                var el = document.createElement('div');
                el.className = 'total-display';
                el.textContent = formatCents(total);
                frame.appendChild(el);
                var items = getDayItems(dateStr);
                var chips = document.createElement('div');
                chips.className = 'cat-chips';
                items.slice(0, MAX_DAY_CHIPS).forEach(function (item) {
                    var c = catOf(item.category);
                    var chip = document.createElement('span');
                    chip.className = 'cat-chip';
                    chip.style.backgroundColor = c.color;
                    chip.textContent = c.emoji;
                    chip.title = c.label + ': ' + item.name + ' ' + formatCents(item.cents);
                    chips.appendChild(chip);
                });
                if (items.length > MAX_DAY_CHIPS) {
                    var more = document.createElement('span');
                    more.className = 'cat-chip more';
                    more.textContent = '+' + (items.length - MAX_DAY_CHIPS);
                    chips.appendChild(more);
                }
                frame.appendChild(chips);
                cell.classList.add(total > budgetCents ? 'day-high' : 'day-low');
                label += ', total ' + formatCents(total);
            } else {
                label += ', no entries';
            }
            if (getInstances(dateStr).length) {
                var badge = document.createElement('span');
                badge.className = 'recurring-badge';
                badge.textContent = '\u21BB';
                badge.title = 'Recurring';
                frame.appendChild(badge);
                label += ', has recurring entries';
            }
            var f = getForecast();
            if (f.hasData && dateStr.indexOf(f.prefix) === 0) {
                var day = parseInt(dateStr.slice(8), 10);
                if (day > f.elapsed) {
                    var proj = document.createElement('div');
                    proj.className = 'projected-display';
                    proj.textContent = '~' + formatCents(f.projected(day));
                    frame.appendChild(proj);
                    label += ', projected month-to-date ' + formatCents(f.projected(day));
                }
            }
            cell.setAttribute('aria-label', label);
            if (!cell.hasAttribute('tabindex')) cell.setAttribute('tabindex', '-1');
        }

        function dayCells() { return calendarEl.querySelectorAll('.fc-daygrid-day[data-date]'); }

        function refreshTotals() {
            dayCells().forEach(function (cell) { decorateCell(cell, cell.getAttribute('data-date')); });
            renderForecastSummary();
            renderBreakdown();
        }

        // Roving tabindex: one tab stop for the grid, arrow keys move between days.
        function setTabStop(target) {
            dayCells().forEach(function (c) { c.setAttribute('tabindex', c === target ? '0' : '-1'); });
        }

        function resetTabStop() {
            setTabStop(calendarEl.querySelector('.fc-daygrid-day.fc-day-today') ||
                calendarEl.querySelector('.fc-daygrid-day:not(.fc-day-other)'));
        }

        // ---- Modal --------------------------------------------------------
        var lastFocus = null;

        function resetForm() {
            editingId = null;
            editingSeriesId = null;
            form.reset();
            repeatInput.disabled = false;
            formError.textContent = '';
            saveBtn.textContent = 'Add entry';
            cancelEditBtn.hidden = true;
        }

        function openModal(dateStr) {
            selectedDate = dateStr;
            lastFocus = document.activeElement;
            document.getElementById('modal-title').textContent =
                'Entries for ' + parseISODate(dateStr).toLocaleDateString('en-US',
                    { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            resetForm();
            quickForm.reset();
            quickHint.textContent = '';
            clearUndo();
            renderEntryList();
            modal.hidden = false;
            nameInput.focus();
        }

        function closeModal() {
            modal.hidden = true;
            clearUndo();
            resetForm();
            var cell = calendarEl.querySelector('.fc-daygrid-day[data-date="' + selectedDate + '"]');
            if (cell) { setTabStop(cell); cell.focus(); }
            else if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        function renderEntryList() {
            entryList.textContent = '';
            getDayItems(selectedDate).forEach(function (entry, index) {
                var li = document.createElement('li');
                li.className = 'entry';
                li.style.setProperty('--cat', catOf(entry.category).color);

                var text = document.createElement('span');
                text.className = 'entry-text';
                text.textContent = (index + 1) + '. ' + (entry.recurring ? '\u21BB ' : '') + catOf(entry.category).emoji + ' ' + entry.name + ' – ' + formatCents(entry.cents) +
                    (entry.remark ? ' – ' + entry.remark : '');

                var actions = document.createElement('span');
                actions.className = 'entry-actions';
                var editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.textContent = entry.recurring ? 'Edit series' : 'Edit';
                editBtn.setAttribute('aria-label', (entry.recurring ? 'Edit series ' : 'Edit ') + entry.name);
                editBtn.onclick = function () { if (entry.recurring) startEditSeries(entry); else startEdit(entry); };
                var delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'delete';
                delBtn.textContent = entry.recurring ? 'Delete series' : 'Delete';
                delBtn.setAttribute('aria-label', (entry.recurring ? 'Delete series ' : 'Delete ') + entry.name);
                delBtn.onclick = function () {
                    if (entry.recurring) {
                        if (!confirm('Delete the whole "' + entry.name + '" series (every month)?')) return;
                        if (editingSeriesId === entry.templateId) resetForm();
                        deleteTemplate(entry.templateId);
                        changed();
                        nameInput.focus();
                        return;
                    }
                    if (editingId === entry.id) resetForm();
                    deleteEntry(selectedDate, entry.id);
                    changed();
                    nameInput.focus();
                };
                actions.appendChild(editBtn);
                actions.appendChild(delBtn);
                li.appendChild(text);
                li.appendChild(actions);
                entryList.appendChild(li);
            });
            totalAmountEl.textContent = 'Total: ' + formatCents(dayTotal(selectedDate));
            overBudgetEl.hidden = dayTotal(selectedDate) <= budgetCents;
        }

        // Re-render everything that shows entries.
        function changed() {
            if (selectedDate && !modal.hidden) renderEntryList();
            refreshTotals();
        }

        function startEdit(entry) {
            editingId = entry.id;
            nameInput.value = entry.name;
            amountInput.value = (entry.cents < 0 ? '-' : '') + Math.floor(Math.abs(entry.cents) / 100) + '.' + pad(Math.abs(entry.cents) % 100);
            remarkInput.value = entry.remark;
            categoryInput.value = catOf(entry.category).key;
            formError.textContent = '';
            saveBtn.textContent = 'Update entry';
            cancelEditBtn.hidden = false;
            repeatInput.checked = false;
            repeatInput.disabled = true;
            nameInput.focus();
        }

        // Template-level edit: changes every month of the series.
        function startEditSeries(instance) {
            startEdit(instance);
            editingId = null;
            editingSeriesId = instance.templateId;
            repeatInput.checked = true;
            saveBtn.textContent = 'Update series';
        }

        // ---- Undo ---------------------------------------------------------
        function clearUndo() {
            clearTimeout(undoTimer);
            undoBar.textContent = '';
        }

        // Shows an "Undo" chip for UNDO_MS that runs `undoFn` once; a newer chip replaces it.
        function showUndo(undoFn) {
            clearUndo();
            var chip = document.createElement('button');
            chip.type = 'button';
            chip.className = 'undo-chip';
            chip.textContent = 'Undo';
            chip.onclick = function () { clearUndo(); undoFn(); changed(); };
            undoBar.appendChild(chip);
            undoTimer = setTimeout(clearUndo, UNDO_MS);
        }

        function undoAddedEntry(dateStr, id) {
            return function () { deleteEntry(dateStr, id); };
        }

        function undoAddedSeries(id) {
            return function () { deleteTemplate(id); };
        }

        // ---- Quick add ----------------------------------------------------
        quickForm.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var raw = quickInput.value;
            if (!raw.trim()) return;
            var parsed = parseQuickAdd(raw);
            if (!parsed) {
                // Typo: create nothing. Hand the text to the manual form and explain the format.
                nameInput.value = raw.trim().slice(0, MAX_NAME);
                quickHint.textContent = 'Could not read that. Use: name amount [refund], e.g. "lunch 12.50" or "coffee 4.75 refund". Nothing was added.';
                nameInput.focus();
                return;
            }
            var id = addEntry(selectedDate, { name: parsed.name, cents: parsed.cents, remark: '' });
            quickForm.reset();
            quickHint.textContent = '';
            changed();
            showUndo(undoAddedEntry(selectedDate, id));
            quickInput.focus();
        });

        form.addEventListener('submit', function (ev) {
            ev.preventDefault();
            var name = nameInput.value.trim();
            var cents = parseCents(amountInput.value);
            if (!name) { formError.textContent = 'Please enter a name.'; nameInput.focus(); return; }
            if (cents === null) {
                formError.textContent = 'Enter an amount like 12.50 (up to 2 decimals, minus sign for refunds, max $1,000,000).';
                amountInput.focus();
                return;
            }
            var fields = { name: name, cents: cents, remark: remarkInput.value.trim(), category: categoryInput.value };
            var undoFn = null;
            if (editingSeriesId) updateTemplate(editingSeriesId, fields);
            else if (editingId) updateEntry(selectedDate, editingId, fields);
            else if (repeatInput.checked) {
                fields.dayOfMonth = parseISODate(selectedDate).getDate();
                undoFn = undoAddedSeries(addTemplate(fields));
            } else undoFn = undoAddedEntry(selectedDate, addEntry(selectedDate, fields));
            resetForm();
            changed();
            if (undoFn) showUndo(undoFn);
            nameInput.focus();
        });

        cancelEditBtn.onclick = function () { resetForm(); nameInput.focus(); };
        document.getElementById('close-modal').onclick = closeModal;

        modal.addEventListener('mousedown', function (ev) {
            if (ev.target === modal) closeModal();
        });

        // Escape closes; Tab stays inside the dialog.
        document.addEventListener('keydown', function (ev) {
            if (modal.hidden) return;
            if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
            if (ev.key !== 'Tab') return;
            var items = Array.prototype.filter.call(
                modal.querySelectorAll('button, input, textarea, select'),
                function (el) { return !el.hidden && !el.disabled; });
            var first = items[0];
            var last = items[items.length - 1];
            if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
            else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
            else if (items.indexOf(document.activeElement) === -1) { ev.preventDefault(); first.focus(); }
        });

        // ---- Calendar -----------------------------------------------------
        if (typeof FullCalendar === 'undefined') {
            setBanner('library', 'The calendar library failed to load (offline, blocked, or the file did not match its integrity hash). Reload to try again.', true);
        } else {
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { left: 'prev,next today', center: 'title', right: '' },
                dayCellDidMount: function (arg) { decorateCell(arg.el, fmtDate(arg.date)); },
                datesSet: function () {
                    // Cells are in the DOM by now; (re)apply totals and the single tab stop.
                    refreshTotals();
                    resetTabStop();
                    // Toolbar chevrons are decorative; the buttons carry the accessible names.
                    calendarEl.querySelectorAll('.fc-icon').forEach(function (i) { i.setAttribute('aria-hidden', 'true'); });
                },
                dateClick: function (info) { openModal(info.dateStr); }
            });
            calendar.render();

            calendarEl.addEventListener('focusin', function (ev) {
                var cell = ev.target.closest && ev.target.closest('.fc-daygrid-day');
                if (cell && ev.target === cell) setTabStop(cell);
            });

            calendarEl.addEventListener('keydown', function (ev) {
                var cell = ev.target;
                if (!cell.classList || !cell.classList.contains('fc-daygrid-day')) return;
                if (ev.key === 'Enter' || ev.key === ' ') {
                    ev.preventDefault();
                    openModal(cell.getAttribute('data-date'));
                    return;
                }
                var step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
                if (!step) return;
                ev.preventDefault();
                var cells = Array.prototype.slice.call(dayCells());
                var next = cells[cells.indexOf(cell) + step];
                if (next) { setTabStop(next); next.focus(); }
            });
        }

        // ---- Toolbar ------------------------------------------------------
        document.getElementById('goto-date').onclick = function () {
            var picked = parseISODate(document.getElementById('date-search').value);
            if (!picked) { say('Pick a valid date first (YYYY-MM-DD).'); return; }
            if (calendar) calendar.gotoDate(picked);
            say('Showing ' + picked.toLocaleDateString('en-US', { month: 'long', year: 'numeric' }) + '.');
        };

        var budgetInput = document.getElementById('budget-input');
        function renderBudgetInput() { budgetInput.value = formatPlain(budgetCents); }
        renderBudgetInput();
        // Blank resets to the default; anything unparseable reverts to the current value.
        budgetInput.addEventListener('change', function () {
            var text = budgetInput.value.trim();
            var cents = text === '' ? null : parseCents(text);
            if (text !== '' && (cents === null || cents < 0)) {
                say('Budget must be an amount like 3000 or 150.50.');
            } else {
                setBudget(cents);
                renderLegend();
                changed();
                say('Daily budget is ' + formatCents(budgetCents) + '.');
            }
            renderBudgetInput();
        });

        document.getElementById('load-demo').onclick = function () {
            if (Object.keys(entries).length && !confirm('Replace all current entries with the fake demo data?')) return;
            seedDemo();
            persist();
            refreshTotals();
            say('Demo data loaded.');
        };

        document.getElementById('export-json').onclick = function () {
            var json = JSON.stringify({ version: SCHEMA_VERSION, exportedAt: new Date().toISOString(), entries: entries, recurring: recurring }, null, 2);
            var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
            var a = document.createElement('a');
            a.href = url;
            a.download = 'veerjis-calendar-' + fmtDate(new Date()) + '.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
            say('Exported ' + countEntries(entries) + ' entries.');
        };

        function countEntries(map) {
            return Object.keys(map).reduce(function (n, k) { return n + map[k].length; }, 0);
        }

        var importFile = document.getElementById('import-file');
        document.getElementById('import-json').onclick = function () { importFile.click(); };

        importFile.addEventListener('change', function () {
            var file = importFile.files[0];
            importFile.value = '';
            if (!file) return;
            if (file.size > MAX_IMPORT_BYTES) { say('Import failed: file is larger than 5 MB.'); return; }
            file.text().then(function (text) {
                var parsed = null;
                try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
                var result = readEnvelope(parsed);
                if (!result || (!countEntries(result.entries) && result.dropped)) {
                    say('Import failed: this is not a valid Veerji\'s Calendar export. Nothing was changed.');
                    return;
                }
                var n = countEntries(result.entries);
                if (!confirm('Replace all current entries with the ' + n + ' entries from this file?')) return;
                entries = result.entries;
                recurring = result.recurring;
                persist();
                refreshTotals();
                if (modal.hidden === false) renderEntryList();
                say('Imported ' + n + ' entries' + (result.dropped ? ' (' + result.dropped + ' invalid skipped).' : '.'));
            }, function () { say('Import failed: could not read the file.'); });
        });
    </script>
</body>

</html>
