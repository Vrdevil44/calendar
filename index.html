<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8' />
    <title>Veerji's Calendar</title>
    <!-- FullCalendar Standard Bundle via CDN -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* General Body Styling */
        body {
            font-family: 'Merriweather', serif;
            background-color: #f4f1ea;
            margin: 0;
            padding: 20px;
        }

        h2 {
            font-family: 'Merriweather', serif;
            font-weight: bold;
            color: #333;
            text-align: center;
            font-size: 36px;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }

        /* Calendar Styling */
        #calendar {
            max-width: 900px;
            margin: 0 auto;
            border: 2px solid #007bff;
            padding: 20px;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Toolbar (Date Search) Styling */
        #toolbar {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #date-search {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 2px solid #007bff;
            background-color: #fff;
            margin-right: 10px;
        }

        #goto-date {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #goto-date:hover {
            background-color: #0056b3;
        }

        #load-demo {
            padding: 10px 15px;
            font-size: 16px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            transition: background-color 0.3s ease;
        }

        #load-demo:hover {
            background-color: #545b62;
        }

        /* Demo-mode notice */
        #demo-note {
            max-width: 900px;
            margin: 0 auto 15px auto;
            padding: 10px 15px;
            background-color: #e7f3ff;
            border: 1px solid #007bff;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
            color: #004085;
            text-align: center;
        }

        /* Modal Popup Styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            border: 2px solid #007bff;
            border-radius: 10px;
            width: 400px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover,
        .close:focus {
            color: black;
        }

        #name-input,
        #amount-input,
        #remark-input {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            font-size: 14px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }

        #save-entry {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            color: white;
            background-color: #28a745;
            margin-top: 20px;
            width: 100%;
            font-size: 16px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        #save-entry:hover {
            background-color: #218838;
        }

        /* Entry and Delete Button Styling */
        .entry {
            margin-top: 10px;
            font-size: 14px;
            padding: 10px;
            border-radius: 5px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
        }

        .entry-delete {
            cursor: pointer;
            color: #dc3545;
            font-size: 18px;
            margin-left: 5px;
        }

        /* Calendar Number and Total Amount Styling */
        .fc-daygrid-day-number {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        /* Center the total amount in the middle of the cell */
        .total-display {
            font-size: 14px;
            color: #333;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        /* Ensure the day cell is relative to place elements inside it */
        .fc-daygrid-day {
            position: relative;
        }

        /* Background color for totals */
        .high-amount {
            background-color: #ff6b6b;
        }

        .low-amount {
            background-color: #6bc46d;
        }

    </style>

    <!-- Local offline store: entries live in the browser's localStorage.
         There is no backend here — this demo never contacts any Firebase project. -->
    <script>
        'use strict';

        var STORE_KEY = 'veerjis-calendar-entries-v1';
        var demoCounter = 0;

        function pad(n) { return (n < 10 ? '0' : '') + n; }

        function fmtDate(d) {
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
        }

        function makeId() {
            demoCounter += 1;
            return 'e' + Date.now().toString(36) + '-' + demoCounter;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // --- Store: { 'YYYY-MM-DD': [ {id, name, amount, remark}, ... ] } ---
        function readStore() {
            try {
                return JSON.parse(localStorage.getItem(STORE_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function writeStore(data) {
            localStorage.setItem(STORE_KEY, JSON.stringify(data));
        }

        function getEntries(dateStr) {
            var data = readStore();
            return data[dateStr] || [];
        }

        function addEntry(dateStr, entry) {
            var data = readStore();
            if (!data[dateStr]) data[dateStr] = [];
            entry.id = makeId();
            data[dateStr].push(entry);
            writeStore(data);
            return entry;
        }

        function deleteEntry(dateStr, id) {
            var data = readStore();
            if (data[dateStr]) {
                data[dateStr] = data[dateStr].filter(function (e) { return e.id !== id; });
                if (data[dateStr].length === 0) delete data[dateStr];
                writeStore(data);
            }
        }

        function dayTotal(dateStr) {
            return getEntries(dateStr).reduce(function (sum, e) { return sum + Number(e.amount); }, 0);
        }

        // --- Seeded demo dataset (relative to today so it always looks alive) ---
        function seedDemo() {
            var today = new Date();
            function daysAgo(n) {
                var d = new Date(today);
                d.setDate(d.getDate() - n);
                return fmtDate(d);
            }

            var data = {};
            function put(dateStr, name, amount, remark) {
                if (!data[dateStr]) data[dateStr] = [];
                data[dateStr].push({ id: makeId(), name: name, amount: amount, remark: remark });
            }

            put(daysAgo(0), 'Grocery run', 84.50, 'Weekly veggies');
            put(daysAgo(1), 'Petrol', 62.00, 'Full tank');
            put(daysAgo(1), 'Tiffin', 260.00, 'Monthly tiffin service');
            put(daysAgo(3), 'Car insurance', 378.00, 'Monthly premium');
            put(daysAgo(4), 'Movie night', 38.75, 'Weekend outing');
            put(daysAgo(6), 'Phone bill', 100.00, 'Virgin Plus');
            // High-spend day to show the red day-cell colouring
            put(daysAgo(9), 'Rent', 1300.00, 'Brentwood 1BHK');
            put(daysAgo(9), 'Laptop down payment', 1400.00, 'Work upgrade');
            put(daysAgo(9), 'Eating out', 320.00, 'Friends visiting');

            writeStore(data);
        }

        document.addEventListener('DOMContentLoaded', function () {
            var calendarEl = document.getElementById('calendar');
            var modal = document.getElementById('entryModal');
            var closeModalBtn = document.getElementsByClassName('close')[0];
            var saveEntryBtn = document.getElementById('save-entry');
            var nameInput = document.getElementById('name-input');
            var amountInput = document.getElementById('amount-input');
            var remarkInput = document.getElementById('remark-input');
            var entryList = document.getElementById('entry-list');
            var totalAmountDisplay = document.getElementById('total-amount');
            var selectedDate = null;

            // Auto-seed demo data on first visit so the calendar is playable right away.
            if (!localStorage.getItem(STORE_KEY)) {
                seedDemo();
            }

            // "Load demo data" button: resets the store to the sample dataset.
            document.getElementById('load-demo').onclick = function () {
                seedDemo();
                displayEntriesForSelectedDate();
                showCalendarTotals();
            };

            // Initialize FullCalendar with Month View
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                editable: true,
                selectable: true,
                events: [],

                customButtons: {
                    dateSearch: {
                        text: 'Go to Date',
                        click: function () {
                            const dateStr = document.getElementById('date-search').value;
                            const picked = new Date(dateStr);
                            if (dateStr && !isNaN(picked.getTime())) {
                                calendar.gotoDate(picked);
                            } else {
                                alert('Invalid Date. Please enter in YYYY-MM-DD format.');
                            }
                        }
                    }
                },

                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dateSearch'
                },

                // Before rendering the calendar, read all entries and show totals in day cells
                datesSet: function () {
                    showCalendarTotals();
                },

                dateClick: function (info) {
                    selectedDate = info.dateStr;
                    displayEntriesForSelectedDate();
                    modal.style.display = 'block'; // Show the modal
                }
            });

            calendar.render();

            // Close the modal
            closeModalBtn.onclick = function () {
                modal.style.display = 'none';
            };

            // Save new entry into the local store
            saveEntryBtn.onclick = function () {
                var name = nameInput.value.trim();
                var amount = parseFloat(amountInput.value.trim());
                var remark = remarkInput.value.trim();

                if (name && !isNaN(amount)) {
                    addEntry(selectedDate, { name: name, amount: amount, remark: remark });

                    // Clear input fields after saving
                    nameInput.value = '';
                    amountInput.value = '';
                    remarkInput.value = '';

                    // Refresh entry list and total amount
                    displayEntriesForSelectedDate();
                    showCalendarTotals(); // Update calendar totals after entry
                }
            };

            // Display existing entries and total amount for the selected date
            function displayEntriesForSelectedDate() {
                entryList.innerHTML = '';

                if (!selectedDate) {
                    totalAmountDisplay.innerHTML = '';
                    return;
                }

                var entries = getEntries(selectedDate);
                var totalAmount = 0;

                entries.forEach(function (entry, index) {
                    var entryDiv = document.createElement('div');
                    entryDiv.className = 'entry';
                    entryDiv.innerHTML = (index + 1) + '. ' + escapeHtml(entry.name) +
                        ' - $' + Number(entry.amount).toFixed(2) + ' - ' + escapeHtml(entry.remark);

                    var deleteBtn = document.createElement('span');
                    deleteBtn.innerHTML = '🗑️';
                    deleteBtn.className = 'entry-delete';
                    (function (id) {
                        deleteBtn.onclick = function () {
                            deleteEntry(selectedDate, id);
                            displayEntriesForSelectedDate();
                            showCalendarTotals(); // Update calendar totals after deletion
                        };
                    })(entry.id);

                    entryDiv.appendChild(deleteBtn);
                    entryList.appendChild(entryDiv);
                    totalAmount += Number(entry.amount);
                });

                totalAmountDisplay.innerHTML = 'Total: $' + totalAmount.toFixed(2);
            }

            // Show totals and color-coded background in the calendar view
            function showCalendarTotals() {
                const days = document.querySelectorAll('.fc-daygrid-day');
                days.forEach(day => {
                    const date = day.getAttribute('data-date');
                    const entries = getEntries(date);

                    // Clear previous total display, if any
                    const totalDisplay = day.querySelector('.total-display');
                    if (totalDisplay) totalDisplay.remove();

                    // Reset background color first
                    day.style.backgroundColor = '';

                    if (entries.length > 0) {
                        var totalAmount = entries.reduce(function (sum, e) {
                            return sum + Number(e.amount);
                        }, 0);

                        // Display total in the cell and append it in the day element
                        const totalElement = document.createElement('div');
                        totalElement.classList.add('total-display');
                        totalElement.innerHTML = '$' + totalAmount.toFixed(2);
                        day.appendChild(totalElement);

                        // Set background color based on the total amount
                        if (totalAmount > 3000) {
                            day.style.backgroundColor = 'tomato'; // High total, set to red
                        } else {
                            day.style.backgroundColor = 'lightgreen'; // Low total, set to green
                        }
                    }
                });
            }

            window.onclick = function (event) {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            };
        });
    </script>

</head>

<body>
    <h2>Veerji's Calendar</h2>
    <div id="demo-note">
        Demo mode — entries are saved in this browser's localStorage only. Nothing leaves your device, no account needed.
    </div>
    <div id="toolbar" style="text-align:center;">
        <input type="date" id="date-search" placeholder="YYYY-MM-DD" />
        <button id="load-demo">Load demo data</button>
    </div>
    <div id='calendar'></div>

    <!-- The Modal Popup for Entries -->
    <div id="entryModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Enter Your Entry</h3>
            <input type="text" id="name-input" placeholder="Name">
            <input type="number" id="amount-input" placeholder="Amount">
            <textarea id="remark-input" placeholder="Remark"></textarea>
            <br>
            <button id="save-entry">Save Entry</button>
            <div id="entry-list"></div>
            <div id="total-amount"></div> <!-- Display the total amount here -->
        </div>
    </div>
</body>

</html>
